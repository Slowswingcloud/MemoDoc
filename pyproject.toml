[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memodoc"
version = "0.1.0"
description = "MemoDoc — 带长期记忆的文档问答 Agent（RAG + Memory）"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "MemoDoc" }]
dependencies = [
    "openai>=1.55,<2",
    "pymupdf>=1.24,<2",
    "gradio>=4.44,<6",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "numpy>=1.26,<3",
    "jieba>=0.42",
    "sentence-transformers>=3.0,<5",
    # transformers 4.57 要求 tokenizers<=0.23.0；钉住上限防被 ragas/langchain 等升级破坏
    "tokenizers>=0.22.0,<=0.23.0",
]

[project.scripts]
memodoc = "memodoc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memodoc"]
